name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-matrix:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go Toolchain
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false # Disable cache on release to prevent cache poisoning attacks

      - name: Compile and Package Artifact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME:-v0.0.0-dev}"
          BIN_NAME="aegis"
          if [ "$GOOS" = "windows" ]; then
            BIN_NAME="aegis.exe"
          fi

          mkdir -p build dist
          go build -trimpath -ldflags="-s -w" -o "build/${BIN_NAME}" ./cmd/aegis

          ARCHIVE="aegis-${VERSION}-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            cd build && zip "../dist/${ARCHIVE}.zip" "${BIN_NAME}" && cd ..
          else
            tar -czvf "dist/${ARCHIVE}.tar.gz" -C build "${BIN_NAME}"
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf6581a12fe429233114 # v4.4.3
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  publish-release:
    name: Attest & Publish Release
    needs: [build-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Required to create release and upload distribution assets
      id-token: write # Required for OIDC identity minting during provenance attestation
      attestations: write # Required to sign and store cryptographic build attestations
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download Build Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 Checksums
        working-directory: dist
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Attest Build Provenance (SLSA v1.0)
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae557ac03d454234743a70 # v1.4.2
        with:
          subject-path: 'dist/*'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$TAG_NAME" ] || [[ "$TAG_NAME" == main* ]]; then
            echo "Skipping release creation: manual trigger without version tag."
            exit 0
          fi
          gh release create "$TAG_NAME" \
            dist/* \
            --title "Aegis $TAG_NAME" \
            --generate-notes
